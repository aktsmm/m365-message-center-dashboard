name: M365 official documents and snapshot-only Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/m365-related-documents.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/m365-related-documents.yml'
  workflow_run:
    workflows:
      - M365 Message Center Dashboard - Public Metadata
      - Microsoft 365 Message Center weekly dashboard
      - Microsoft 365 Message Center bounded translations
    types: [completed]

concurrency:
  group: m365-message-center-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-documents.txt
      - run: python -m unittest discover -s tests -p 'test_documents.py'
      - shell: pwsh
        run: ./scripts/ci/Test-M365Dashboard.ps1

  enrich:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        with:
          path: .cache/m365-documents.json
          key: learn-documents-${{ github.run_id }}
          restore-keys: learn-documents-
      - run: python -m pip install -r scripts/requirements-documents.txt
      - name: Enrich approved on-disk snapshots using unauthenticated public Learn MCP
        run: python scripts/Update-M365RelatedDocuments.py
      - name: Rebuild all approved snapshots without Graph
        shell: pwsh
        run: |
          ./scripts/Update-M365DashboardSnapshots.ps1
          ./scripts/New-M365DashboardAboutPage.ps1 -OutputPath reports/m365/latest/about/index.html
          New-Item -ItemType Directory -Path _site -Force | Out-Null
          Copy-Item reports/m365/latest/* _site -Recurse -Force
          Copy-Item reports/m365/related-documents.json _site -Force
          '' | Set-Content _site/.nojekyll
      - name: Persist only public documentation annotations and rendered snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/m365/related-documents.json 'reports/m365/**/index.html'
          if ! git diff --cached --quiet; then
            git commit -m "Enrich approved snapshots with official documents [skip ci]"
            git push
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: enrich
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
