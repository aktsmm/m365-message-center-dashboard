name: M365 dashboard content quality and repair

on:
  workflow_dispatch:
    inputs:
      retry_skipped_run_id:
        description: "Optional completed bot run whose agent never started; verified before retry."
        required: false
        type: string
  schedule:
    - cron: '27 3,15 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: m365-message-center-pages
  cancel-in-progress: false

jobs:
  inspect-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Inspect the approved snapshot and request at most one repair
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_SKIPPED_RUN_ID: ${{ inputs.retry_skipped_run_id }}
        run: |
          $parameters = @{ Repository = $env:GITHUB_REPOSITORY; Apply = $true; TrustedAutomationApproved = $true }
          if ($env:RETRY_SKIPPED_RUN_ID) {
            if ($env:RETRY_SKIPPED_RUN_ID -notmatch '^\d+$') { throw 'Invalid skipped run ID.' }
            $parameters.RetrySkippedRunId = [long]$env:RETRY_SKIPPED_RUN_ID
          }
          ./scripts/Invoke-M365DashboardRepair.ps1 @parameters
          $state = Get-Content reports/m365/repair-state.json -Raw
          @('## Content quality and bounded repair', '', '```json', $state, '```') |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Persist only the public repair checkpoint
        if: always()
        shell: bash
        run: |
          if [ ! -f reports/m365/repair-state.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/m365/repair-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Record bounded M365 content repair status [skip ci]"
            git push
          fi
